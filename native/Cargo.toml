[package]
name = "alpha-trade-native"
version = "1.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
include_dir = "0.7"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
